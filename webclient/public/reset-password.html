<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Finance — Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="auth-page">
    <div class="auth-art" aria-hidden="true">
      <img class="auth-icons" src="/images/auth-icons.svg" alt="" />
      <img class="auth-skyline" src="/images/auth-skyline.svg" alt="" />
    </div>

    <header class="auth-brand">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 72 72" width="56" height="56">
          <path fill="#4f46e5" fill-rule="evenodd" d="M14 10h24c11.6 0 20 7.2 20 17.6 0 8.2-5.2 14.6-13.2 16.8L56 62H44.4L34 46H26v16H14V10zm12 8v20h12.4c6.2 0 10.4-3.4 10.4-9.4S44.6 18 38.4 18H26z"/>
          <path fill="#22c55e" d="M46 8l16 14h-9v16h-10V22h-9L46 8z"/>
        </svg>
      </div>
      <h1>Property Finance</h1>
      <p>Choose a new password for your account</p>
    </header>

    <main class="auth-card">
      <form id="reset-form" class="stack">
        <div class="field">
          <label>New password</label>
          <div class="auth-input">
            <span class="auth-input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V6z"/></svg>
            </span>
            <input name="password" type="password" autocomplete="new-password" placeholder="Enter a new password" minlength="6" required />
          </div>
        </div>
        <div class="field">
          <label>Confirm password</label>
          <div class="auth-input">
            <span class="auth-input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V6z"/></svg>
            </span>
            <input name="confirm" type="password" autocomplete="new-password" placeholder="Confirm your password" minlength="6" required />
          </div>
        </div>
        <button class="btn auth-submit" type="submit">Update password</button>
      </form>
      <div class="status" id="auth-status">Enter your new password.</div>
      <p class="auth-alt"><a href="/">Back to Sign In</a></p>
    </main>
    <script src="/config.js"></script>
    <script type="module" src="/pages/reset-password.js"></script>
  </body>
</html>
