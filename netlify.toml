[build]
  command = "npm install && npm --prefix backend install && npm --prefix backend run build && npm --prefix webclient install && npm --prefix webclient run build"
  publish = "webclient/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  BINARY_CONTENT_TYPES = "image/jpeg,image/jpg,image/png,image/gif,image/webp,application/pdf,application/octet-stream"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "bcryptjs"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
